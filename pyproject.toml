[project]
name = "changeloglint"
version = "0.1.0"
description = "Lint changelog fragments for broken links, missing versions, and section issues."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["changelog", "markdown", "lint", "keep-a-changelog", "release-notes", "link-validation", "cli", "python"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
changeloglint = "changeloglint:main"

[tool.setuptools]
py-modules = ["changeloglint"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = [".github"]
